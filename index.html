    overflow: visible;
    min-width: 0;
}

/* PUNK CHAOTIC NAV LINKS */

}

        2px 2px 0 #ff008c,
        -2px -2px 0 #00eaff;

/* GLOBAL NEON TEXT ------------------------------------------- */

/* ============================

.hero-section {

.social-stack {

.fb-header {

    text-shadow: 0 0 10px #ff00ff;
    display: inline-block;
    transform: rotate(45deg);
    animation: fb-bounce 1s infinite;
    margin-top: 5px;
}

@keyframes fb-bounce {
    0%, 100% { transform: rotate(45deg) translateY(0); }
    50% { transform: rotate(45deg) translateY(8px); }
}

.facebook-embed,
.youtube-embed {
    background: #111;
    border: 2px dashed var(--neon);
    padding: 15px;
    border-radius: 10px;
    animation: fadeIn 0.8s ease-out, neonPulse 3s infinite ease-in-out;
}

.facebook-embed iframe,
.youtube-embed iframe {
    width: 100%;
    border-radius: 10px;
    border: 2px solid var(--neon);
    box-shadow: 0 0 15px var(--neon);
}

/* ============================
   ANIMATIONS
============================ */

@keyframes neonPulse {
    0% { box-shadow: 0 0 15px rgba(255, 43, 205, 0.3); }
    50% { box-shadow: 0 0 30px rgba(255, 43, 205, 0.7); }
    100% { box-shadow: 0 0 15px rgba(255, 43, 205, 0.3); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* BUTTONS ----------------------------------------------------- */

.hero-buttons {
    margin-top: 20px;

    text-indent: -9999px;

    cursor: pointer;
}

.grid {

.card {

.card img,

.card h2 {

body, html {

/* FLEA -------------------------------------------------------- */
#flea-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.flea {
    width: 3px;
    height: 3px;
    background: #ff00ff;
    position: absolute;
    border-radius: 50%;
    box-shadow: 0 0 6px #ff00ff;
    opacity: 0;
    pointer-events: auto;

    /* Invisible click hitbox without affecting layout */
    transform-origin: center;
}

.flea::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;   /* hitbox width */
    height: 20px;  /* hitbox height */
    transform: translate(-50%, -50%);
    pointer-events: auto;
}

.flea-dot {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #ff00ff;
    border-radius: 50%;
    box-shadow: 0 0 6px #ff00ff;
    opacity: 1;
    animation: fadeOut 0.6s linear forwards;
}

@keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; transform: scale(0.5); }
}

.explosion {
    position: absolute;
    width: 10px;
    height: 10px;
    background: radial-gradient(circle, #ff00ff, transparent);
    border-radius: 50%;
    pointer-events: none;
    animation: explode 0.4s ease-out forwards;
}

@keyframes explode {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(4); opacity: 0; }
}


/* Fullscreen background video */
#bgVid {

    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: -1; /* pushes it behind everything */
    pointer-events: none; /* prevents clicks from hitting it */
}

/* Fade overlay */
.video-fader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: black;
    opacity: 0;
    transition: opacity 0.6s ease;

.site-title {

.nav-strip, .nav-centered, .nav-centered a {
