/* FLEA -------------------------------------------------------- */
#flea-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.flea {
    width: 3px;
    height: 3px;
    background: #ff00ff;
    position: absolute;
    border-radius: 50%;
    box-shadow: 0 0 6px #ff00ff;
    opacity: 0;
    pointer-events: auto;

    /* Invisible click hitbox without affecting layout */
    transform-origin: center;
}

.flea::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;   /* hitbox width */
    height: 20px;  /* hitbox height */
    transform: translate(-50%, -50%);
    pointer-events: auto;
}

.flea-dot {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #ff00ff;
    border-radius: 50%;
    box-shadow: 0 0 6px #ff00ff;
    opacity: 1;
    animation: fadeOut 0.6s linear forwards;
}

@keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; transform: scale(0.5); }
}

.explosion {
    position: absolute;
    width: 10px;
    height: 10px;
    background: radial-gradient(circle, #ff00ff, transparent);
    border-radius: 50%;
    pointer-events: none;
    animation: explode 0.4s ease-out forwards;
}

@keyframes explode {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(4); opacity: 0; }
}

.bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1; /* video is behind content */
}

.video-fader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    opacity: 0;
    z-index: -2; /* fade is behind video */
    transition: opacity 0.6s ease;
}

<script>
let idleTime = 0;
let fleas = [];
const container = document.getElementById("flea-container");

// Create a new flea
function spawnFlea(x, y) {
    const flea = document.createElement("div");
    flea.classList.add("flea");

    flea.style.left = x + "px";
    flea.style.top = y + "px";

    // Random velocity
    flea.vx = (Math.random() * 4) + 2;
    flea.vy = (Math.random() * 4) + 2;

    flea.active = false;

    // Click to explode + split
    flea.addEventListener("click", () => explodeFlea(flea));

    container.appendChild(flea);
    fleas.push(flea);

    return flea;
}

// Explosion + splitting
function explodeFlea(flea) {
    const x = flea.offsetLeft;
    const y = flea.offsetTop;

    // Explosion effect
    const boom = document.createElement("div");
    boom.classList.add("explosion");
    boom.style.left = x + "px";
    boom.style.top = y + "px";
    container.appendChild(boom);

    setTimeout(() => boom.remove(), 400);

    // Remove original flea
    flea.remove();
    fleas = fleas.filter(f => f !== flea);

    // Spawn two new fleas
    spawnFlea(x, y);
    spawnFlea(x + 10, y + 10);
}

// Neon trail
function leaveTrail(x, y) {
    const dot = document.createElement("div");
    dot.classList.add("flea-dot");
    dot.style.left = x + "px";
    dot.style.top = y + "px";
    container.appendChild(dot);

    setTimeout(() => dot.remove(), 600);
}

// Movement engine
function moveFleas() {
    fleas.forEach(flea => {
        if (!flea.active) return;

        let x = flea.offsetLeft;
        let y = flea.offsetTop;

        // Jitter
        const jitterX = (Math.random() - 0.5) * 6;
        const jitterY = (Math.random() - 0.5) * 6;

        // Random direction changes
        if (Math.random() < 0.05) flea.vx = (Math.random() * 6) - 3;
        if (Math.random() < 0.05) flea.vy = (Math.random() * 6) - 3;

        x += flea.vx + jitterX;
        y += flea.vy + jitterY;

        // Bounce off walls
        if (x <= 0 || x >= window.innerWidth - 3) flea.vx = -flea.vx;
        if (y <= 0 || y >= window.innerHeight - 3) flea.vy = -flea.vy;

        flea.style.left = x + "px";
        flea.style.top = y + "px";

        leaveTrail(x, y);
    });
}

// Idle detection
function resetIdle() {
    idleTime = 0;
}

document.onmousemove = resetIdle;
document.onkeydown = resetIdle;
document.onclick = resetIdle;
document.onscroll = resetIdle;

// Idle timer
setInterval(() => {
    idleTime++;

    // TEST MODE: 1 second
    if (idleTime >= 1) {
        if (fleas.length === 0) {
            spawnFlea(
                Math.random() * window.innerWidth,
                Math.random() * window.innerHeight
            );
        }

        fleas.forEach(f => {
            f.style.opacity = 1;
            f.active = true;
        });
    }

}, 200);

// Movement loop
setInterval(moveFleas, 16);
</script>
