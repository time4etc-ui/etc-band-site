/* GLOBAL ------------------------------------------------------ */

body {
    margin: 0;
    font-family: Arial, sans-serif;

    text-align: center;
}


/* PUNK CHAOS NAV -------------------------------------------------- */
/* ============================================================
   CHAOTIC NEON PUNK HEADER
   ============================================================ */

.punk-header {
    width: 100%;
    padding: 25px 40px 15px;
    background: #0a0a0a;
    border-top: 3px dashed #ff2bcd;
    border-bottom: 3px dashed #ff2bcd;
    box-shadow: 0 0 25px #ff2bcd, inset 0 0 20px #ff2bcd;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;

    position: sticky;
    top: 0;
    z-index: 999;

    /* slight chaotic tilt */
    transform: rotate(-0.4deg);
}

/* RESTORED CLEAN HEADER ---------------------------------------- */

.nav-strip {
    width: 100%;
    padding: 25px 40px 10px;
    background: #111;
    border-top: 2px dashed #ff2bcd;
    border-bottom: 2px dashed #ff2bcd;
    box-shadow: 0 0 25px rgba(255, 43, 205, 0.5);

    display: flex;
    justify-content: space-between;
    align-items: center;

    position: sticky;
    top: 0;
    z-index: 999;

    /* FIX: allow children to shrink instead of ellipsis */
    min-width: 0;
}

/* LOGO — original neon look */
.logo {
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 32px;
    color: #ff2bcd;
    text-shadow: 0 0 12px #ff2bcd, 0 0 22px #ff2bcd;

    /* FIX: prevent ellipsis */
    white-space: normal;
    overflow: visible;
    min-width: 0;
}

/* NAV LINKS — original clean version */
.nav-centered {
    display: flex;
    gap: 40px;

    /* FIX: prevent squeezing */
    min-width: 0;
}

.nav-centered a {
    color: #ff2bcd;
    text-decoration: none;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 0 10px #ff2bcd;
}

.nav-centered a:hover {
    color: white;
    text-shadow: 0 0 12px white, 0 0 20px white;
}

    
/* GLOBAL NEON TEXT ------------------------------------------- */
h1, h2, h3, p, a, .tag {
    color: #ff2bcd;
    text-shadow: 0 0 10px #ff2bcd, 0 0 20px #ff2bcd;
}


/* ============================

body {

.hero-section {

.band-photo-container {

.socials-row {

.social-box {

    border-radius: 10px;

.hero-img {

.social-stack {

    flex-direction: column;

}

.fb-header {

.fb-header h2 {

.fb-arrow {
    font-size: 3rem;
    color: #ff00ff;
    text-shadow: 0 0 10px #ff00ff;
    display: inline-block;
    transform: rotate(45deg); /* points down-left */
    animation: fb-bounce 1s infinite;
    margin-top: 5px;
}

@keyframes fb-bounce {
    0%, 100% { transform: rotate(45deg) translateY(0); }
    50% { transform: rotate(45deg) translateY(8px); }
}


.facebook-embed,

.youtube-embed {
    background: #111;
    border: 2px dashed var(--neon);
    padding: 15px;
    border-radius: 10px;
    animation: fadeIn 0.8s ease-out, neonPulse 3s infinite ease-in-out;
}

.facebook-embed iframe,
.youtube-embed iframe {
    width: 100%;
    border-radius: 10px;
    border: 2px solid var(--neon);
    box-shadow: 0 0 15px var(--neon);
}

/* ============================
   ANIMATIONS
============================ */

@keyframes neonPulse {
    0% { box-shadow: 0 0 15px rgba(255, 43, 205, 0.3); }
    50% { box-shadow: 0 0 30px rgba(255, 43, 205, 0.7); }
    100% { box-shadow: 0 0 15px rgba(255, 43, 205, 0.3); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

body, html {

.nav-strip {

/* FLEA -------------------------------------------------------- */
#flea-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.flea {
    width: 3px;
    height: 3px;
    background: #ff00ff;
    position: absolute;
    border-radius: 50%;
    box-shadow: 0 0 6px #ff00ff;
    opacity: 0;
    pointer-events: auto;

    /* Invisible click hitbox without affecting layout */
    transform-origin: center;
}

.flea::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;   /* hitbox width */
    height: 20px;  /* hitbox height */
    transform: translate(-50%, -50%);
    pointer-events: auto;
}

.flea-dot {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #ff00ff;
    border-radius: 50%;
    box-shadow: 0 0 6px #ff00ff;
    opacity: 1;
    animation: fadeOut 0.6s linear forwards;
}

@keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; transform: scale(0.5); }
}

.explosion {
    position: absolute;
    width: 10px;
    height: 10px;
    background: radial-gradient(circle, #ff00ff, transparent);
    border-radius: 50%;
    pointer-events: none;
    animation: explode 0.4s ease-out forwards;
}

@keyframes explode {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(4); opacity: 0; }
}


/* Fullscreen background video */
#bgVid {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: -1; /* pushes it behind everything */
    pointer-events: none; /* prevents clicks from hitting it */
}

/* Fade overlay */
.video-fader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: black;
    opacity: 0;
    transition: opacity 0.6s ease;
    z-index: -1; /* stays behind content */
}

        /* Your existing content stays above */
