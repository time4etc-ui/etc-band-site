    .gallery {
        column-count: 3;
        column-gap: 15px;
        max-width: 1400px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .gallery img {
        width: 100%;
        margin-bottom: 15px;
        border-radius: 8px;
        cursor: pointer;
        transition: opacity 0.3s ease;
    }

    .gallery img:hover {
        opacity: 0.8;
    }

    @media (max-width: 900px) {
        .gallery {
            column-count: 2;
        }
    }

    @media (max-width: 600px) {
        .gallery {
            column-count: 1;
        }
    }

    /* Fullscreen viewer */
    #lightbox {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.95);
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s ease;
        z-index: 9999;
    }

    #lightbox.active {
        opacity: 1;
        pointer-events: auto;
    }

    #lightbox img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 10px;
    }
</style>

<script>
    // Open fullscreen on click
    document.addEventListener("click", function(e) {
        if (e.target.tagName === "IMG" && e.target.parentElement.classList.contains("gallery")) {
            const lightbox = document.getElementById("lightbox");
            const lightboxImg = document.getElementById("lightbox-img");
            lightboxImg.src = e.target.src;
            lightbox.classList.add("active");
        }
    });

    // Close fullscreen when clicking outside the image
    document.getElementById("lightbox").addEventListener("click", function(e) {
        if (e.target.id === "lightbox" || e.target.id === "lightbox-img") {
            this.classList.remove("active");
        }
    });
</script>
