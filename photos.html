<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ETC Band Photos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ---------------- NAV BAR ---------------- */

/* PUNK CHAOTIC NAV — UNIVERSAL VERSION */
.nav-strip {
    width: 100%;
    background: black;
    padding: 20px 0;
    border-bottom: 4px solid #ff00ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 9999;
}

.logo {
    font-size: 40px;
    font-weight: 900;
    color: #ff00ff;
    text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
    letter-spacing: 3px;
}

.nav-centered {
    display: flex;
    gap: 40px;
}

.nav-centered a {
    color: white;
    text-decoration: none;
    font-size: 22px;
    font-weight: bold;
    transform: rotate(-2deg);
    text-shadow: 0 0 10px #ff00ff;
    transition: 0.2s ease;
}

.nav-centered a:hover {
    color: #ff00ff;
    text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff;
    transform: rotate(2deg) scale(1.1);
}


/* ---------------- BACKGROUND ---------------- */

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    position: relative;
    background: #111;
    color: #fff;
    text-align: center;
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
   background-image: url('assets/etclogoGradiant.png');


    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    z-index: -1;
    pointer-events: none;
}

/* ---------------- PAGE SPACING ---------------- */

h1 {
    margin-top: 160px;
    font-size: 2.2rem;
    letter-spacing: 1px;
}

/* ---------------- MASONRY GALLERY ---------------- */

.masonry-grid {
    column-count: 4;
    column-gap: 15px;
    padding: 20px;
}

.masonry-item {
    width: 100%;
    margin-bottom: 15px;
    border-radius: 10px;
    display: block;
    break-inside: avoid;
    box-shadow: 0 0 10px #ff2bcd;
    cursor: pointer;
}

/* Responsive */
@media (max-width: 900px) { .masonry-grid { column-count: 3; } }
@media (max-width: 600px) { .masonry-grid { column-count: 2; } }
@media (max-width: 400px) { .masonry-grid { column-count: 1; } }

/* ---------------- FULLSCREEN VIEWER ---------------- */

#lightbox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s ease;
    z-index: 9999;
}

#lightbox.active {
    opacity: 1;
    pointer-events: auto;
}

#lightbox img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 10px;
}

</style>
</head>

<body>

<div class="nav-strip">
    <div class="logo">EXPIRED TACO COUPON</div>
    <nav class="nav-centered">
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="photos.html">PHOTOS</a>
        <a href="contact.html">CONTACT</a>
    </nav>
</div>


<h1>ETC Band Photos</h1>

<!-- NEW gallery container -->
<div id="photo-grid" class="masonry-grid"></div>

<!-- Lightbox -->
<div id="lightbox">
    <img id="lightbox-img" src="">
</div>

<script>
// Base R2 path
const base = "https://pub-c4a87b530c7a4af4a2eb70d617dd24e6.r2.dev/Pictures/photos/";
const manifestUrl = base + "NewJsonForWebsite.txt?v=3"; // bump version when updating JSON

async function loadPhotos() {
    const res = await fetch(manifestUrl);
    const data = await res.json();

    const container = document.getElementById("photo-grid");

    /* ---------------- RECENT SECTION ---------------- */
    if (data.Recent && data.Recent.length > 0) {
      

        data.Recent.forEach(file => {
            const img = document.createElement("img");

            // IMPORTANT: Your actual folder path
            img.src = base + "Recent/New%20Pictures%20for%20Website/" + encodeURIComponent(file);

            img.loading = "lazy";
            img.classList.add("masonry-item");
            container.appendChild(img);
        });
    }

    /* ---------------- OLDER PHOTOS SECTION ---------------- */
    if (data.photos && data.photos.length > 0) {
     

        data.photos.forEach(file => {
            const img = document.createElement("img");

            // These photos are in the root folder
            img.src = base + encodeURIComponent(file);

            img.loading = "lazy";
            img.classList.add("masonry-item");
            container.appendChild(img);
        });
    }
}

loadPhotos();

/* ---------------- LIGHTBOX ---------------- */
document.addEventListener("click", function(e) {
    if (e.target.classList.contains("masonry-item")) {
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        lightboxImg.src = e.target.src;
        lightbox.classList.add("active");
    }
});

document.getElementById("lightbox").addEventListener("click", function() {
    this.classList.remove("active");
});
</script>


</body>
</html>
