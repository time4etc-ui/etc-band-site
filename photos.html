<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ETC Band Photos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ---------------- NAV BAR ---------------- */

.nav-strip {
    box-sizing: border-box;
    width: 100%;
    padding: 25px 40px 10px;
    background: #111;
    border-top: 2px dashed #ff2bcd;
    border-bottom: 2px dashed #ff2bcd;
    box-shadow: 0 0 25px rgba(255, 43, 205, 0.5);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    top: 0;
    z-index: 999;
}

.nav-strip .logo a {
    color: #ff2bcd;
    text-shadow: 0 0 12px #ff2bcd, 0 0 22px #ff2bcd;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 32px;
    text-decoration: none;
}

.nav-centered a {
    margin-left: 20px;
    color: #ff2bcd;
    text-decoration: none;
    font-weight: bold;
    text-shadow: 0 0 8px #ff2bcd;
}

.nav-centered a:hover {
    color: white;
    text-shadow: 0 0 12px white;
}

/* ---------------- BACKGROUND ---------------- */

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    position: relative;
    background: #111;
    color: #fff;
    text-align: center;
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
   background-image: url('assets/etclogoGradiant.png');


    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    z-index: -1;
    pointer-events: none;
}

/* ---------------- PAGE SPACING ---------------- */

h1 {
    margin-top: 160px;
    font-size: 2.2rem;
    letter-spacing: 1px;
}

/* ---------------- MASONRY GALLERY ---------------- */

.masonry-grid {
    column-count: 4;
    column-gap: 15px;
    padding: 20px;
}

.masonry-item {
    width: 100%;
    margin-bottom: 15px;
    border-radius: 10px;
    display: block;
    break-inside: avoid;
    box-shadow: 0 0 10px #ff2bcd;
    cursor: pointer;
}

/* Responsive */
@media (max-width: 900px) { .masonry-grid { column-count: 3; } }
@media (max-width: 600px) { .masonry-grid { column-count: 2; } }
@media (max-width: 400px) { .masonry-grid { column-count: 1; } }

/* ---------------- FULLSCREEN VIEWER ---------------- */

#lightbox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s ease;
    z-index: 9999;
}

#lightbox.active {
    opacity: 1;
    pointer-events: auto;
}

#lightbox img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 10px;
}

</style>
</head>

<body>

<header class="nav-strip">
    <div class="logo">
        <a href="index.html">EXPIRED TACO COUPON</a>
    </div>

    <nav class="nav-centered">
        <a href="about.html">ABOUT</a>
        <a href="photos.html">PHOTOS</a>
        <a href="contact.html">CONTACT</a>
    </nav>
</header>

<h1>ETC Band Photos</h1>

<!-- NEW gallery container -->
<div id="photo-grid" class="masonry-grid"></div>

<!-- Lightbox -->
<div id="lightbox">
    <img id="lightbox-img" src="">
</div>

<script>
// Load photos from JSON
const base = "https://pub-c4a87b530c7a4af4a2eb70d617dd24e6.r2.dev/Pictures/photos/";
const manifestUrl = base + "photos2.json";


async function loadPhotos() {
    const res = await fetch(manifestUrl);
    const data = await res.json();

    const container = document.getElementById("photo-grid");

    data.photos.forEach(file => {
        const img = document.createElement("img");
        img.src = base + encodeURIComponent(file);
        img.loading = "lazy";
        img.classList.add("masonry-item");
        container.appendChild(img);
    });
}

loadPhotos();

// Lightbox
document.addEventListener("click", function(e) {
    if (e.target.classList.contains("masonry-item")) {
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        lightboxImg.src = e.target.src;
        lightbox.classList.add("active");
    }
});

document.getElementById("lightbox").addEventListener("click", function(e) {
    this.classList.remove("active");
});
</script>

</body>
</html>
