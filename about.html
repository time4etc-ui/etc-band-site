<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About – Expired Taco Coupon</title>

    <style>
        body {
            background-color: black;
            color: white;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* NAV BAR */
        .nav-strip {
            width: 100%;
            background: black;
            padding: 20px 0;
            border-bottom: 4px solid #ff00ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 9999;
        }

        .logo {
            font-size: 40px;
            font-weight: 900;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            letter-spacing: 3px;
        }

        .nav-centered {
            display: flex;
            gap: 40px;
        }

        .nav-centered a {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            transform: rotate(-2deg);
            text-shadow: 0 0 10px #ff00ff;
            transition: 0.2s ease;
        }

        .nav-centered a:hover {
            color: #ff00ff;
            text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff;
            transform: rotate(2deg) scale(1.1);
        }

        /* PAGE CONTENT SPACING */
        .page-content {
            margin-top: 120px;
            padding: 20px;
        }

        /* NEON TITLES */
        .neon-title {
            text-align: center;
            font-size: 48px;
            font-weight: 900;
            color: #ff00ff;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
        }

        /* BAND GRID */
        .band-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            padding: 0 20px;
        }

        .member-card {
            background: #111;
            border: 2px solid #ff00ff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 15px #ff00ff55;
        }

        .member-card img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .member-card h2 {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .role {
            font-style: italic;
            color: #ff66ff;
            margin-bottom: 10px;
        }

        /* STORY SECTION */
        .band-story {
            margin-top: 60px;
            padding: 20px;
            text-align: center;
        }

        .band-story p {
            max-width: 700px;
            margin: 0 auto;
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <div class="nav-strip">
        <div class="logo">EXPIRED TACO COUPON</div>
        <nav class="nav-centered">
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT</a>
            <a href="photos.html">PHOTOS</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </div>

    <div class="page-content">

        <!-- MEET THE BAND -->
        <h1 class="neon-title">Meet the Band</h1>

        <!-- Dynamic band grid -->
        <div class="band-grid" id="band-grid"></div>

        <!-- STORY SECTION -->
        <section class="band-story">
            <h1 class="neon-title">Our Story</h1>
            <p>
                Southwest Kansas Boys Covering music they grew up to. Mostly Punk, Alternative, Rock, and Metal. so if thats your vibe hit us up!
            </p>
        </section>

    </div>

    <!-- JSON LOADER SCRIPT -->
    <script>
        const base = "https://pub-c4a87b530c7a4af4a2eb70d617dd24e6.r2.dev/Pictures/photos/About%20photos/";
        const manifestUrl = base + "band.json?v=1";

        async function loadBand() {
            const res = await fetch(manifestUrl);
            const data = await res.json();

            const container = document.getElementById("band-grid");

            data.members.forEach(member => {
                const card = document.createElement("div");
                card.classList.add("member-card");

                card.innerHTML = `
                    <img src="${base + member.photo}" alt="${member.name}">
                    <h2>${member.name}</h2>
                    <p class="role">${member.role}</p>
                    <p>${member.bio}</p>
                `;

                container.appendChild(card);
            });
        }

        loadBand();
    </script>

</body>
</html>
